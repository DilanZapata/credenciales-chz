<VirtualHost *:80>
    # La aplicacion se sirve desde la raiz del proyecto (patron de Porcify
    # Manager). La proteccion del arbol interno la imponen los .htaccess de
    # cada directorio: app/ denegado salvo api/ y views/{css,js,img}, y
    # config/, database/, storage/, tests/, docs/ y bin/ denegados por completo.
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Detras del proxy de Dokploy (Traefik) el esquema real viaja en las
    # cabeceras X-Forwarded-*. Recuerde poner APP_TRUST_PROXY=true.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
